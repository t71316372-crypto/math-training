<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>さんすうトレーニング</title>

<style>
body {
  font-family: sans-serif;
  margin: 0;
  background: #f7f7f7;
  text-align: center;
}

.app {
  max-width: 480px;
  margin: auto;
  padding: 20px;
}

h1 {
  font-size: 28px;
}

.mode button,
.level button {
  font-size: 18px;
  padding: 10px;
  margin: 5px;
  border-radius: 12px;
  border: 1px solid #ccc;
  background: white;
}

.question {
  font-size: 48px;
  margin: 30px 0;
  font-weight: bold;
}

input {
  font-size: 36px;
  width: 160px;
  text-align: center;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid #aaa;
}

.main-button {
  font-size: 26px;
  padding: 14px 32px;
  margin-top: 20px;
  border-radius: 16px;
  border: none;
  background: #333;
  color: white;
}

.result {
  font-size: 30px;
  margin: 25px 0;
  min-height: 40px;
}

.score {
  font-size: 18px;
  margin-top: 20px;
}

.active {
  background: #333 !important;
  color: white;
}

.wrong-list {
  margin-top: 20px;
  font-size: 16px;
}
</style>
</head>

<body>
<div class="app">

<h1>さんすうトレーニング</h1>

<div class="mode">
  <button onclick="setMode('add')" id="mode-add">たし算</button>
  <button onclick="setMode('sub')" id="mode-sub">ひき算</button>
  <button onclick="setMode('mul')" id="mode-mul">かけ算</button>
  <button onclick="setMode('div')" id="mode-div">わり算</button>
  <button onclick="setMode('big')" id="mode-big">大きな数</button>
<button onclick="setMode('decimal')" id="mode-decimal">小数</button>
<button onclick="setMode('unit')" id="mode-unit">単位換算</button>
  <button onclick="setMode('fraction')" id="mode-fraction">分数</button>
<button onclick="setMode('area')" id="mode-area">面積</button>
<button onclick="setMode('angle')" id="mode-angle">角度</button>
  <button onclick="setMode('story')" id="mode-story">文章題</button>
</div>

<div class="level">
  <button onclick="setLevel(1)" id="level-1">かんたん</button>
  <button onclick="setLevel(2)" id="level-2">ふつう</button>
  <button onclick="setLevel(3)" id="level-3">むずかしい</button>
</div>

<div class="question" id="question">?</div>

<input id="answer" type="number" inputmode="numeric">

<br>

<button class="main-button" onclick="checkAnswer()">こたえる</button>
<br>
<button class="main-button" onclick="showExplanation()">解説を見る</button>  

<div class="result" id="result"></div>

<div class="score">
  正解：<span id="correct">0</span>　
  まちがい：<span id="wrong">0</span>　
  連続正解：<span id="streak">0</span>
</div>

<button class="main-button" onclick="reviewWrong()">まちがい復習</button>

<div class="wrong-list" id="wrongList"></div>
<div class="wrong-list" id="explanation"></div>
</div>

<script>
let mode = "mul";
let level = 1;

let a = 0;
let b = 0;
let correctAnswer = 0;

let correctCount = 0;
let wrongCount = 0;
let streak = 0;

let wrongProblems = [];

const modeLabels = {
  add: "たし算",
  sub: "ひき算",
  mul: "かけ算",
  div: "わり算",
  big: "大きな数",
  decimal: "小数",
  unit: "単位換算",
fraction: "分数",
area: "面積",
angle: "角度",
story: "文章題"
};

function setMode(newMode) {
  mode = newMode;
  updateButtons();
  nextQuestion();
}

function setLevel(newLevel) {
  level = newLevel;
  updateButtons();
  nextQuestion();
}

function updateButtons() {
  document.querySelectorAll(".mode button").forEach(btn => btn.classList.remove("active"));
  document.querySelectorAll(".level button").forEach(btn => btn.classList.remove("active"));

  const modeBtn = document.getElementById("mode-" + mode);
  if (modeBtn) modeBtn.classList.add("active");

  document.getElementById("level-" + level).classList.add("active");
}

function rand(n) {
  return Math.floor(Math.random() * n) + 1;
}

function playSuccess() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.frequency.value = 880;
  osc.connect(gain);
  gain.connect(ctx.destination);

  gain.gain.setValueAtTime(0.2, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);

  osc.start();
  osc.stop(ctx.currentTime + 0.15);
}

function playFail() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.frequency.value = 220;
  osc.connect(gain);
  gain.connect(ctx.destination);

  gain.gain.setValueAtTime(0.2, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);

  osc.start();
  osc.stop(ctx.currentTime + 0.3);
}

function nextQuestion() {
  if (mode === "add") createAddQuestion();
  if (mode === "sub") createSubQuestion();
  if (mode === "mul") createMulQuestion();
  if (mode === "div") createDivQuestion();
  if (mode === "big") createBigNumberQuestion();
  if (mode === "decimal") createDecimalQuestion();
  if (mode === "unit") createUnitQuestion();
if (mode === "fraction") createFractionQuestion();
if (mode === "area") createAreaQuestion();
if (mode === "angle") createAngleQuestion();
  if (mode === "story") createStoryQuestion();
  
  document.getElementById("answer").value = "";
  document.getElementById("answer").focus();
  document.getElementById("result").innerText = "";
}

function createAddQuestion() {
  const max = level === 1 ? 20 : level === 2 ? 100 : 999;
  a = rand(max);
  b = rand(max);
  correctAnswer = a + b;
  showQuestion(`${a} + ${b}`);
}

function createSubQuestion() {
  const max = level === 1 ? 20 : level === 2 ? 100 : 999;
  a = rand(max);
  b = rand(max);
  if (b > a) [a, b] = [b, a];
  correctAnswer = a - b;
  showQuestion(`${a} - ${b}`);
}

function createMulQuestion() {
  const max = level === 1 ? 9 : level === 2 ? 12 : 20;
  a = rand(max);
  b = rand(max);
  correctAnswer = a * b;
  showQuestion(`${a} × ${b}`);
}

function createDivQuestion() {
  b = rand(level === 1 ? 9 : 12);
  correctAnswer = rand(level === 1 ? 9 : 20);
  a = b * correctAnswer;
  showQuestion(`${a} ÷ ${b}`);
}

function createBigNumberQuestion() {
  const patterns = [
    () => {
      const unit = level === 1 ? 1000 : level === 2 ? 10000 : 100000;
      a = rand(9) * unit;
      b = rand(9) * unit;
      correctAnswer = a + b;
      showQuestion(`${a} + ${b}`);
    },
    () => {
      const unit = level === 1 ? 10000 : level === 2 ? 100000 : 1000000;
      a = rand(9) * unit;
      correctAnswer = a / 10000;
      showQuestion(`${a} は何万？`);
    }
  ];

  patterns[rand(patterns.length) - 1]();
}

function createDecimalQuestion() {
  if (level === 1) {
    a = rand(30) / 10;
    b = rand(30) / 10;
  } else if (level === 2) {
    a = rand(300) / 100;
    b = rand(300) / 100;
  } else {
    a = rand(3000) / 100;
    b = rand(3000) / 100;
  }

  if (Math.random() < 0.5) {
    correctAnswer = Number((a + b).toFixed(2));
    showQuestion(`${a} + ${b}`);
  } else {
    if (b > a) [a, b] = [b, a];
    correctAnswer = Number((a - b).toFixed(2));
    showQuestion(`${a} - ${b}`);
  }
}
function createUnitQuestion() {
  let patterns;

  if (level === 1) {
    patterns = [
      () => {
        a = rand(9);
        correctAnswer = a * 100;
        showQuestion(`${a}m は何cm？`);
      },
      () => {
        a = rand(9);
        correctAnswer = a * 1000;
        showQuestion(`${a}kg は何g？`);
      },
      () => {
        a = rand(9);
        correctAnswer = a * 1000;
        showQuestion(`${a}L は何mL？`);
      }
    ];
  } else if (level === 2) {
    patterns = [
      () => {
        a = rand(9) * 100;
        correctAnswer = a / 100;
        showQuestion(`${a}cm は何m？`);
      },
      () => {
        a = rand(9) * 1000;
        correctAnswer = a / 1000;
        showQuestion(`${a}g は何kg？`);
      },
      () => {
        a = rand(9) * 1000;
        correctAnswer = a / 1000;
        showQuestion(`${a}mL は何L？`);
      }
    ];
  } else {
    patterns = [
      () => {
        a = rand(30) / 10;
        correctAnswer = a * 100;
        showQuestion(`${a}m は何cm？`);
      },
      () => {
        a = rand(30) / 10;
        correctAnswer = a * 1000;
        showQuestion(`${a}kg は何g？`);
      },
      () => {
        a = rand(30) / 10;
        correctAnswer = a * 1000;
        showQuestion(`${a}L は何mL？`);
      }
    ];
  }

  patterns[rand(patterns.length) - 1]();
}

function showQuestion(text) {
  document.getElementById("question").innerText = text;
}

function checkAnswer() {
  const input = document.getElementById("answer").value;

  if (input === "") {
    document.getElementById("result").innerText = "こたえを入れてね";
    return;
  }

  const userAnswer = Number(input);

  if (userAnswer === correctAnswer) {
    playSuccess();
    correctCount++;
    streak++;

    document.getElementById("result").innerText =
      streak >= 3 ? "🔥 れんぞく正解！" : "⭕ せいかい！";

    updateScore();
    setTimeout(nextQuestion, 800);
  } else {
    playFail();
    wrongCount++;
    streak = 0;

    wrongProblems.push({
      mode: modeLabels[mode],
      question: document.getElementById("question").innerText,
      answer: correctAnswer
    });

    document.getElementById("result").innerText = `❌ 答えは ${correctAnswer}`;
    updateScore();
    setTimeout(nextQuestion, 1500);
  }
}
function createFractionQuestion() {
  const denominator = level === 1 ? rand(5) + 1 : level === 2 ? rand(8) + 1 : rand(10) + 2;

  let n1 = rand(denominator - 1);
  let n2 = rand(denominator - 1);

  if (level <= 2) {
    if (Math.random() < 0.5) {
      correctAnswer = n1 + n2;
      showQuestion(`${n1}/${denominator} + ${n2}/${denominator} = □/${denominator}`);
    } else {
      if (n2 > n1) [n1, n2] = [n2, n1];
      correctAnswer = n1 - n2;
      showQuestion(`${n1}/${denominator} - ${n2}/${denominator} = □/${denominator}`);
    }
  } else {
    const whole = rand(3);
    correctAnswer = whole * denominator + n1 + n2;
    showQuestion(`${whole}と${n1}/${denominator} + ${n2}/${denominator} = □/${denominator}`);
  }
}

function createAreaQuestion() {
  if (level === 1) {
    const width = rand(9);
    const height = rand(9);
    correctAnswer = width * height;
    showQuestion(`たて${height}cm よこ${width}cm の面積`);
  } else if (level === 2) {
    const width = rand(20);
    const height = rand(20);
    correctAnswer = width * height;
    showQuestion(`たて${height}cm よこ${width}cm の面積`);
  } else {
    const width = rand(30);
    const height = rand(30);
    correctAnswer = width * height;
    showQuestion(`たて${height}m よこ${width}m の面積`);
  }
}

function createAngleQuestion() {
  let patterns;

  if (level === 1) {
    patterns = [
      () => {
        correctAnswer = 90;
        showQuestion("直角は何度？");
      },
      () => {
        correctAnswer = 180;
        showQuestion("一直線の角度は何度？");
      }
    ];
  } else if (level === 2) {
    patterns = [
      () => {
        const x = rand(8) * 10;
        correctAnswer = 180 - x;
        showQuestion(`180° - ${x}°`);
      },
      () => {
        const x = rand(8) * 10;
        correctAnswer = 90 - x;
        showQuestion(`90° - ${x}°`);
      }
    ];
  } else {
    patterns = [
      () => {
        const x = rand(12) * 10;
        const y = rand(6) * 10;
        correctAnswer = 180 - x - y;
        showQuestion(`180° - ${x}° - ${y}°`);
      },
      () => {
        const x = rand(6) * 10;
        const y = rand(3) * 10;
        correctAnswer = 90 - x - y;
        showQuestion(`90° - ${x}° - ${y}°`);
      }
    ];
  }

  patterns[rand(patterns.length) - 1]();
}
  function createStoryQuestion() {
  let patterns;

  if (level === 1) {
    patterns = [
      () => {
        const apples = rand(9) * 4;
        const people = 4;
        correctAnswer = apples / people;
        showQuestion(`りんごが${apples}こあります。${people}人で同じ数ずつ分けると、1人何こ？`);
      },
      () => {
        const price = rand(9) * 100;
        const count = rand(5);
        correctAnswer = price * count;
        showQuestion(`${price}円のノートを${count}さつ買います。代金はいくら？`);
      }
    ];
  } else if (level === 2) {
    patterns = [
      () => {
        const price = rand(5) * 100;
        const count = rand(5);
        const paid = 1000;
        correctAnswer = paid - price * count;
        showQuestion(`${price}円のノートを${count}さつ買い、1000円出しました。おつりはいくら？`);
      },
      () => {
        const perDay = rand(9) * 10;
        const days = rand(5);
        correctAnswer = perDay * days;
        showQuestion(`1日に${perDay}ページ読みます。${days}日で何ページ読む？`);
      }
    ];
  } else {
    patterns = [
      () => {
        const people = rand(9) * 4;
        const capacity = 4;
        correctAnswer = Math.ceil(people / capacity);
        showQuestion(`${people}人います。1台に${capacity}人乗れます。車は何台必要？`);
      },
      () => {
        const price = rand(9) * 80;
        const count = rand(6);
        const paid = 2000;
        correctAnswer = paid - price * count;
        showQuestion(`${price}円の商品を${count}こ買い、2000円出しました。おつりはいくら？`);
      }
    ];
  }

  patterns[rand(patterns.length) - 1]();
}
function updateScore() {
  document.getElementById("correct").innerText = correctCount;
  document.getElementById("wrong").innerText = wrongCount;
  document.getElementById("streak").innerText = streak;
}

function reviewWrong() {
  const list = document.getElementById("wrongList");

  if (wrongProblems.length === 0) {
    list.innerHTML = "まちがえた問題はまだありません。";
    return;
  }

  let html = "<b>まちがえた問題</b><br>";

  wrongProblems.slice(-5).forEach(p => {
    html += `【${p.mode}】${p.question} = ${p.answer}<br>`;
  });

  list.innerHTML = html;
}

document.getElementById("answer").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    checkAnswer();
  }
});
function showExplanation() {
  const exp = document.getElementById("explanation");

  const explanations = {
    decimal: `
      <b>小数の考え方</b><br>
      小数は、1より小さい数や、細かい量を表す数です。<br>
      0.1は「10分の1」です。<br>
      計算するときは、小数点の位置をそろえることが大切です。
    `,

    fraction: `
      <b>分数の考え方</b><br>
      分数は、1つのものを同じ大きさに分けた数です。<br>
      1/3は「3つに分けたうちの1つ」です。<br>
      分母が同じときは、分子だけをたしたりひいたりします。
    `,

    unit: `
      <b>単位換算の考え方</b><br>
      単位を変えるときは、何倍になるかを考えます。<br>
      1m = 100cm<br>
      1kg = 1000g<br>
      1L = 1000mL
    `,

    area: `
      <b>面積の考え方</b><br>
      面積は、広さを表します。<br>
      長方形の面積は、たて × よこ です。<br>
      たて5cm、よこ8cmなら、5 × 8 = 40㎠ です。
    `,

    angle: `
      <b>角度の考え方</b><br>
      角度は、開きぐあいを表します。<br>
      直角は90°です。<br>
      一直線は180°です。<br>
      90°や180°から引いて考える問題がよく出ます。
    `,

    story: `
      <b>文章題の考え方</b><br>
      文章題では、まず「何を聞かれているか」を見ます。<br>
      次に、使う数字を探します。<br>
      最後に、たし算・ひき算・かけ算・わり算のどれを使うか考えます。<br><br>
      同じ数ずつ分ける → わり算<br>
      何こ分・何日分 → かけ算<br>
      残り → ひき算
    `
  };

  exp.innerHTML = explanations[mode] || "このモードの解説はまだありません。";
}
updateButtons();
nextQuestion();
</script>

</body>
</html>
