<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>さんすうトレーニング</title>

<style>
body {
  font-family: sans-serif;
  margin: 0;
  background: #f7f7f7;
  text-align: center;
}

.app {
  max-width: 480px;
  margin: auto;
  padding: 20px;
}

h1 {
  font-size: 28px;
}

.mode button,
.level button {
  font-size: 18px;
  padding: 10px;
  margin: 5px;
  border-radius: 12px;
  border: 1px solid #ccc;
  background: white;
}

.question {
  font-size: 48px;
  margin: 30px 0;
  font-weight: bold;
}

input {
  font-size: 36px;
  width: 160px;
  text-align: center;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid #aaa;
}

.main-button {
  font-size: 26px;
  padding: 14px 32px;
  margin-top: 20px;
  border-radius: 16px;
  border: none;
  background: #333;
  color: white;
}

.result {
  font-size: 30px;
  margin: 25px 0;
  min-height: 40px;
}

.score {
  font-size: 18px;
  margin-top: 20px;
}

.active {
  background: #333 !important;
  color: white;
}

.wrong-list {
  margin-top: 20px;
  font-size: 16px;
}
</style>
</head>

<body>
<div class="app">

<h1>さんすうトレーニング</h1>

<div class="mode">
  <button onclick="setMode('add')" id="mode-add">たし算</button>
  <button onclick="setMode('sub')" id="mode-sub">ひき算</button>
  <button onclick="setMode('mul')" id="mode-mul">かけ算</button>
  <button onclick="setMode('div')" id="mode-div">わり算</button>
  <button onclick="setMode('big')" id="mode-big">大きな数</button>
<button onclick="setMode('decimal')" id="mode-decimal">小数</button>
<button onclick="setMode('unit')" id="mode-unit">単位換算</button>
</div>

<div class="level">
  <button onclick="setLevel(1)" id="level-1">かんたん</button>
  <button onclick="setLevel(2)" id="level-2">ふつう</button>
  <button onclick="setLevel(3)" id="level-3">むずかしい</button>
</div>

<div class="question" id="question">?</div>

<input id="answer" type="number" inputmode="numeric">

<br>

<button class="main-button" onclick="checkAnswer()">こたえる</button>

<div class="result" id="result"></div>

<div class="score">
  正解：<span id="correct">0</span>　
  まちがい：<span id="wrong">0</span>　
  連続正解：<span id="streak">0</span>
</div>

<button class="main-button" onclick="reviewWrong()">まちがい復習</button>

<div class="wrong-list" id="wrongList"></div>

</div>

<script>
let mode = "mul";
let level = 1;

let a = 0;
let b = 0;
let correctAnswer = 0;

let correctCount = 0;
let wrongCount = 0;
let streak = 0;

let wrongProblems = [];

const modeLabels = {
  add: "たし算",
  sub: "ひき算",
  mul: "かけ算",
  div: "わり算",
  big: "大きな数",
  decimal: "小数",
  unit: "単位換算"
};

function setMode(newMode) {
  mode = newMode;
  updateButtons();
  nextQuestion();
}

function setLevel(newLevel) {
  level = newLevel;
  updateButtons();
  nextQuestion();
}

function updateButtons() {
  document.querySelectorAll(".mode button").forEach(btn => btn.classList.remove("active"));
  document.querySelectorAll(".level button").forEach(btn => btn.classList.remove("active"));

  const modeBtn = document.getElementById("mode-" + mode);
  if (modeBtn) modeBtn.classList.add("active");

  document.getElementById("level-" + level).classList.add("active");
}

function rand(n) {
  return Math.floor(Math.random() * n) + 1;
}

function playSuccess() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.frequency.value = 880;
  osc.connect(gain);
  gain.connect(ctx.destination);

  gain.gain.setValueAtTime(0.2, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);

  osc.start();
  osc.stop(ctx.currentTime + 0.15);
}

function playFail() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.frequency.value = 220;
  osc.connect(gain);
  gain.connect(ctx.destination);

  gain.gain.setValueAtTime(0.2, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);

  osc.start();
  osc.stop(ctx.currentTime + 0.3);
}

function nextQuestion() {
  if (mode === "add") createAddQuestion();
  if (mode === "sub") createSubQuestion();
  if (mode === "mul") createMulQuestion();
  if (mode === "div") createDivQuestion();
  if (mode === "big") createBigNumberQuestion();
  if (mode === "decimal") createDecimalQuestion();
  if (mode === "unit") createUnitQuestion();

  document.getElementById("answer").value = "";
  document.getElementById("answer").focus();
  document.getElementById("result").innerText = "";
}

function createAddQuestion() {
  const max = level === 1 ? 20 : level === 2 ? 100 : 999;
  a = rand(max);
  b = rand(max);
  correctAnswer = a + b;
  showQuestion(`${a} + ${b}`);
}

function createSubQuestion() {
  const max = level === 1 ? 20 : level === 2 ? 100 : 999;
  a = rand(max);
  b = rand(max);
  if (b > a) [a, b] = [b, a];
  correctAnswer = a - b;
  showQuestion(`${a} - ${b}`);
}

function createMulQuestion() {
  const max = level === 1 ? 9 : level === 2 ? 12 : 20;
  a = rand(max);
  b = rand(max);
  correctAnswer = a * b;
  showQuestion(`${a} × ${b}`);
}

function createDivQuestion() {
  b = rand(level === 1 ? 9 : 12);
  correctAnswer = rand(level === 1 ? 9 : 20);
  a = b * correctAnswer;
  showQuestion(`${a} ÷ ${b}`);
}

function createBigNumberQuestion() {
  const patterns = [
    () => {
      a = rand(9) * 10000;
      b = rand(9) * 1000;
      correctAnswer = a + b;
      showQuestion(`${a} + ${b}`);
    },
    () => {
      a = rand(9) * 100000;
      correctAnswer = a / 10000;
      showQuestion(`${a} は何万？`);
    }
  ];
  patterns[rand(patterns.length) - 1]();
}

function createDecimalQuestion() {
  a = rand(30) / 10;
  b = rand(30) / 10;

  if (Math.random() < 0.5) {
    correctAnswer = Number((a + b).toFixed(1));
    showQuestion(`${a} + ${b}`);
  } else {
    if (b > a) [a, b] = [b, a];
    correctAnswer = Number((a - b).toFixed(1));
    showQuestion(`${a} - ${b}`);
  }
}

function createUnitQuestion() {
  const patterns = [
    () => {
      a = rand(9);
      correctAnswer = a * 100;
      showQuestion(`${a}m は何cm？`);
    },
    () => {
      a = rand(9);
      correctAnswer = a * 1000;
      showQuestion(`${a}kg は何g？`);
    },
    () => {
      a = rand(9);
      correctAnswer = a * 1000;
      showQuestion(`${a}L は何mL？`);
    }
  ];
  patterns[rand(patterns.length) - 1]();
}

function showQuestion(text) {
  document.getElementById("question").innerText = text;
}

function checkAnswer() {
  const input = document.getElementById("answer").value;

  if (input === "") {
    document.getElementById("result").innerText = "こたえを入れてね";
    return;
  }

  const userAnswer = Number(input);

  if (userAnswer === correctAnswer) {
    playSuccess();
    correctCount++;
    streak++;

    document.getElementById("result").innerText =
      streak >= 3 ? "🔥 れんぞく正解！" : "⭕ せいかい！";

    updateScore();
    setTimeout(nextQuestion, 800);
  } else {
    playFail();
    wrongCount++;
    streak = 0;

    wrongProblems.push({
      mode: modeLabels[mode],
      question: document.getElementById("question").innerText,
      answer: correctAnswer
    });

    document.getElementById("result").innerText = `❌ 答えは ${correctAnswer}`;
    updateScore();
    setTimeout(nextQuestion, 1500);
  }
}

function updateScore() {
  document.getElementById("correct").innerText = correctCount;
  document.getElementById("wrong").innerText = wrongCount;
  document.getElementById("streak").innerText = streak;
}

function reviewWrong() {
  const list = document.getElementById("wrongList");

  if (wrongProblems.length === 0) {
    list.innerHTML = "まちがえた問題はまだありません。";
    return;
  }

  let html = "<b>まちがえた問題</b><br>";

  wrongProblems.slice(-5).forEach(p => {
    html += `【${p.mode}】${p.question} = ${p.answer}<br>`;
  });

  list.innerHTML = html;
}

document.getElementById("answer").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    checkAnswer();
  }
});

updateButtons();
nextQuestion();
</script>

</body>
</html>
